<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terraria 存档转换器</title>
<style>
  :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color:#172033; background:#eef2f7; }
  * { box-sizing:border-box; }
  body { min-height:100vh; margin:0; display:grid; place-items:center; padding:28px 16px; background:radial-gradient(circle at 15% 10%, #fff 0, transparent 35%), linear-gradient(135deg,#eef2f7,#e6ebf2); }
  main { width:min(100%, 620px); }
  .eyebrow { margin:0 0 10px; color:#64748b; font-size:.78rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  h1 { margin:0; font-size:clamp(2rem,6vw,3rem); letter-spacing:-.055em; line-height:1.05; }
  .intro { margin:16px 0 28px; color:#64748b; }
  .card { padding:28px; border:1px solid #fff; border-radius:24px; background:#ffffffd9; box-shadow:0 24px 70px #5365811f, 0 3px 10px #53658112; backdrop-filter:blur(12px); }
  .route-picker { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; }
  .route-side { padding:13px 14px; border:1px solid #d7dee8; border-radius:12px; background:#fff; text-align:center; }
  .route-side strong { font-size:.95rem; }
  #swap { width:44px; height:44px; margin:0; padding:0; border:0; border-radius:12px; background:#203a68; color:#fff; font-size:1.2rem; line-height:1; }
  #swap:hover:not(:disabled) { background:#2d528e; transform:translateY(-1px); }
  .drop { display:block; margin-top:18px; padding:34px 18px; border:1.5px dashed #b8c3d2; border-radius:16px; color:#64748b; text-align:center; cursor:pointer; transition:.2s ease; }
  .drop strong { display:block; margin-bottom:5px; color:#334155; }
  .drop:hover, .drop:focus-within { border-color:#5278b8; background:#f7faff; }
  input { display:block; width:100%; margin-top:12px; color:#64748b; font-size:.85rem; }
  input[type="file"]::file-selector-button { margin-right:10px; padding:9px 13px; border:0; border-radius:10px; background:#203a68; color:#fff; font:600 .85rem inherit; cursor:pointer; transition:.2s ease; }
  input[type="file"]::file-selector-button:hover { background:#2d528e; }
  button { width:100%; margin-top:18px; padding:13px 16px; border:0; border-radius:12px; background:#203a68; color:white; font:700 1rem inherit; cursor:pointer; transition:.2s ease; }
  button:hover:not(:disabled) { background:#2d528e; transform:translateY(-1px); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { min-height:24px; margin-top:16px; color:#526176; font-size:.9rem; white-space:pre-wrap; }
  code { padding:2px 5px; border-radius:5px; background:#edf1f6; color:#334155; }
  .note { margin:15px 4px 0; color:#8995a6; font-size:.78rem; line-height:1.6; }
</style>
</head>
<body>
<main>
<h1>存档转换器</h1>
<p class="intro">国服与国际服 / 电脑端</p>
<div class="card">
  <div class="route-picker" aria-label="转换方向">
    <div class="route-side"><strong id="source-label">国服</strong></div>
    <button id="swap" type="button" aria-label="调转转换方向" title="调转方向">→</button>
    <div class="route-side"><strong id="target-label">国际服 / 电脑端</strong></div>
  </div>
  <label class="drop" for="file">点击选择文件，或把存档拖到这里
    <strong>选择 .wld 或 .plr 存档</strong>
    <input id="file" type="file" accept=".wld,.plr,.bak,*/*">
  </label>
  <button id="convert" disabled>转换并下载</button>
  <div id="status" role="status"></div>
</div>
<p class="note">文件只在浏览器本地处理，不会上传。转换前请备份原存档，并确认两端游戏版本兼容。</p>
</main>
<script>
// Terraria .plr uses AES-128-CBC, UTF-16LE("h3y_gUyZ") as both key and IV,
// with no padding. Web Crypto only exposes CBC with implicit PKCS#7 padding,
// so use this small dependency-free AES implementation instead.
const sbox = new Uint8Array(256), invSbox = new Uint8Array(256);
const rotl8 = (x, n) => ((x << n) | (x >>> (8 - n))) & 255;
function gmul(a, b) { let p = 0; for (let i = 0; i < 8; i++) { if (b & 1) p ^= a; a = (a & 128) ? ((a << 1) ^ 0x11b) : a << 1; b >>>= 1; } return p & 255; }
function gpow(a, n) { let r = 1; while (n) { if (n & 1) r = gmul(r, a); a = gmul(a, a); n >>>= 1; } return r; }
for (let x = 0; x < 256; x++) { const y = x ? gpow(x, 254) : 0; const s = y ^ rotl8(y, 1) ^ rotl8(y, 2) ^ rotl8(y, 3) ^ rotl8(y, 4) ^ 0x63; sbox[x] = s; invSbox[s] = x; }
function expandKey(key) { const w = new Uint8Array(176); w.set(key); let bytes = 16, rcon = 1; while (bytes < 176) { let t = w.slice(bytes - 4, bytes); if (bytes % 16 === 0) { t = new Uint8Array([sbox[t[1]], sbox[t[2]], sbox[t[3]], sbox[t[0]]]); t[0] ^= rcon; rcon = gmul(rcon, 2); } for (let i = 0; i < 4; i++) { w[bytes] = w[bytes - 16] ^ t[i]; bytes++; } } return w; }
function addKey(a, k, off) { for (let i = 0; i < 16; i++) a[i] ^= k[off + i]; }
function invShiftRows(a) { const t = a.slice(); for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) a[4*c+r] = t[4*((c-r+4)%4)+r]; }
function invSubBytes(a) { for (let i = 0; i < 16; i++) a[i] = invSbox[a[i]]; }
function invMixColumns(a) { for (let c = 0; c < 4; c++) { const i=4*c, a0=a[i],a1=a[i+1],a2=a[i+2],a3=a[i+3]; a[i]=gmul(a0,14)^gmul(a1,11)^gmul(a2,13)^gmul(a3,9); a[i+1]=gmul(a0,9)^gmul(a1,14)^gmul(a2,11)^gmul(a3,13); a[i+2]=gmul(a0,13)^gmul(a1,9)^gmul(a2,14)^gmul(a3,11); a[i+3]=gmul(a0,11)^gmul(a1,13)^gmul(a2,9)^gmul(a3,14); } }
function decryptBlock(src, key) { const a=src.slice(), k=expandKey(key); addKey(a,k,160); for (let round=9; round>0; round--) { invShiftRows(a); invSubBytes(a); addKey(a,k,16*round); invMixColumns(a); } invShiftRows(a); invSubBytes(a); addKey(a,k,0); return a; }
function encryptBlock(src, key) { const a=src.slice(), k=expandKey(key); const sub=a=>{for(let i=0;i<16;i++)a[i]=sbox[a[i]]}, shift=a=>{const t=a.slice();for(let r=0;r<4;r++)for(let c=0;c<4;c++)a[4*c+r]=t[4*((c+r)%4)+r]}, mix=a=>{for(let c=0;c<4;c++){const i=4*c,x=a.slice(i,i+4);a[i]=gmul(x[0],2)^gmul(x[1],3)^x[2]^x[3];a[i+1]=x[0]^gmul(x[1],2)^gmul(x[2],3)^x[3];a[i+2]=x[0]^x[1]^gmul(x[2],2)^gmul(x[3],3);a[i+3]=gmul(x[0],3)^x[1]^x[2]^gmul(x[3],2)}}; addKey(a,k,0); for(let round=1;round<10;round++){sub(a);shift(a);mix(a);addKey(a,k,16*round)} sub(a);shift(a);addKey(a,k,160); return a; }
function cbc(data, key, decrypt) { if (data.length % 16) throw new Error('人物文件长度不是 AES 块大小的整数，可能不是标准 .plr 文件'); const out=new Uint8Array(data.length), iv=key.slice(); for(let p=0;p<data.length;p+=16){const block=data.slice(p,p+16); let x; if (decrypt) { x=decryptBlock(block,key); for(let i=0;i<16;i++) out[p+i]=x[i]^iv[i]; iv.set(block); } else { for(let i=0;i<16;i++) block[i]^=iv[i]; x=encryptBlock(block,key); out.set(x,p); iv.set(x); }} return out; }
function playerKey() { return new Uint8Array([0x68,0,0x33,0,0x79,0,0x5f,0,0x67,0,0x55,0,0x79,0,0x5a,0]); }
function replaceSignature(input, oldSignature, newSignature) { const oldBytes=new TextEncoder().encode(oldSignature), newBytes=new TextEncoder().encode(newSignature); let count=0; for(let i=0;i<=input.length-oldBytes.length;i++){let ok=true;for(let j=0;j<oldBytes.length;j++)if(input[i+j]!==oldBytes[j]){ok=false;break;}if(ok){input.set(newBytes,i);count++;i+=oldBytes.length-1;}} return count; }
const fileInput = document.querySelector('#file');
const button = document.querySelector('#convert');
const status = document.querySelector('#status');
const swapButton = document.querySelector('#swap');
const sourceLabel = document.querySelector('#source-label');
const targetLabel = document.querySelector('#target-label');
let reverse = false;
let selected;
function updateRoute() {
  sourceLabel.textContent = reverse ? '国际服 / 电脑端' : '国服';
  targetLabel.textContent = reverse ? '国服' : '国际服 / 电脑端';
  swapButton.textContent = reverse ? '←' : '→';
}
swapButton.addEventListener('click', () => { reverse = !reverse; updateRoute(); });
fileInput.addEventListener('change', () => { selected = fileInput.files[0]; button.disabled = !selected; status.textContent = selected ? `已选择：${selected.name}` : ''; });

document.querySelector('.drop').addEventListener('dragover', e => { e.preventDefault(); });
document.querySelector('.drop').addEventListener('drop', e => { e.preventDefault(); selected = e.dataTransfer.files[0]; button.disabled = !selected; status.textContent = selected ? `已选择：${selected.name}` : ''; });

button.addEventListener('click', async () => {
  if (!selected) return;
  button.disabled = true;
  try {
    const input = new Uint8Array(await selected.arrayBuffer());
    const isPlayer = /\.plr(?:\.bak)?$/i.test(selected.name);
    const [sourceSignature, targetSignature, sourceName, targetName] = reverse
      ? ['relogic', 'xindong', '国际服 / 电脑端', '国服']
      : ['xindong', 'relogic', '国服', '国际服 / 电脑端'];
    const key = playerKey();
    const plain = isPlayer ? cbc(input, key, true) : input;
    const sourceCount = replaceSignature(plain, sourceSignature, sourceSignature);
    if (!sourceCount) throw new Error(`未找到${sourceName}签名 ${sourceSignature}，请确认转换方向和文件版本正确。`);
    const count = sourceSignature === targetSignature ? sourceCount : replaceSignature(plain, sourceSignature, targetSignature);
    const output = isPlayer ? cbc(plain, key, false) : plain;
    const blob = new Blob([output], {type: 'application/octet-stream'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const dot = selected.name.lastIndexOf('.');
    a.download = (dot > 0 ? selected.name.slice(0, dot) : selected.name) + '_converted' + (dot > 0 ? selected.name.slice(dot) : '');
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    status.textContent = `转换完成：${isPlayer ? '人物已解密/重新加密，' : ''}${sourceSignature === targetSignature ? '电脑端与国际服签名相同，未改动内容；' : `替换 ${count} 处 ${sourceSignature} → ${targetSignature}；`}目标：${targetName}，已开始下载 ${a.download}`;
  } catch (e) { status.textContent = '转换失败：' + e.message; }
  finally { button.disabled = !selected; }
});
</script>
</body>
</html>
